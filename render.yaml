# render.yaml - Complete Infrastructure as Code for SETU
services:
  - type: web
    name: setu-backend
    env: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt && python manage.py collectstatic --no-input"
    startCommand: "python manage.py migrate --no-input && python manage.py seed_demo_data && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,setu-8.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,https://setu-8.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://setu-8.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: setu-db
          property: connectionString

  - type: web
    name: setu-frontend
    env: node
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npx serve -s dist -l $PORT"
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_URL
        value: "https://setu-8.onrender.com/api"

databases:
  - name: setu-db
    databaseName: setu_db
    user: setu_user
    plan: free
